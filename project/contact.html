<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contaact Us</title>
    <meta name="description"
        content="Contact KIJ Mobility for inquiries, support, or feedback regarding our transportation services in Kinshasa.">
    <meta name="author" content="Joe Kabusako Iviti">
    <link rel="stylesheet" href="styles/site.css">
    <script src="scripts/site.js" defer></script>
</head>

<body>
    <header>
        <h1>Contact Us</h1>
        <img src="images/kijlogo.jpg" alt="KIJ Mobility Logo" width="100">
        <button id="hamburger-btn" aria-label="Open the Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Transportation Services</a></li>
                <li><a href="destinations.html">Kinshasa + future Destinations</a></li>
                <li><a href="request.html">Request A Ride</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form id="contact-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p id="contact-feedback" aria-live="polite"></p>

        <section id="saved-messages">
            <h2>My Saved Messages</h2>
            <p id="message-count"></p>
            <ul id="message-list"></ul>
        </section>


    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 👷‍♂️Joe Kabusako Iviti👷‍♂️ Congo-Kinshasa .All rights reserved.</p>
        <p id="lastModified"></p>
        <a href="references.html">References</a>
    </footer>

</body>

</html>
