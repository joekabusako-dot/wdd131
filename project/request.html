<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIJ Request Ride </title>
    <meta name="description"
        content="Request a ride with KIJ Mobility, your trusted transportation service in Kinshasa. Fill out our online form to schedule your ride today.">
    <meta name="author" content="Joe Kabusako Iviti">
    <link rel="stylesheet" href="styles/site.css">
    <script src="scripts/site.js" defer></script>
</head>

<body>
    <header>
        <h1>Request A Ride</h1>
        <img src="images/kijlogo.jpg" alt="KIJ Mobility Logo" width="100">
        <button id="hamburger-btn" aria-label="Open the Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Transportation Services</a></li>
                <li><a href="destinations.html">Kinshasa + future Destinations</a></li>
                <li><a href="request.html">Request A Ride</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>

            </ul>
        </nav>
    </header>
    <main id="request-form">

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="number">Phone Number</label>
            <input type="tel" id="number" name="number" required>

            <label for="pickup">Pickup Location</label>
            <input type="text" id="pickup" name="pickup" required>

            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination" required>

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>

            <button type="submit">Submit Ride</button>
        </form>

        <p id="request-feedback" aria-live="polite"></p>
        <section id="saved-requests">

            <h2>My Saved Ride Requests</h2>
            <p id="request-count"></p>
            <ul id="request-list"></ul>
        </section>

    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> 👷‍♂️Joe Kabusako Iviti👷‍♂️ Congo-Kinshasa .All rights reserved.</p>
        <p id="lastModified"></p>
        <a href="references.html">References</a>
    </footer>

</body>

</html>
